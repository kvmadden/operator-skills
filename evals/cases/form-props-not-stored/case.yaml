schema_version: "1.0"
name: form-props-not-stored
description: A new optional field on component props, which are not stored data, so no migration question applies. Development case.
tags: [tier-1, schema-discipline, stay-quiet, development]
context:
  scaffold_script: ../../scaffold/patient-form.sh
execution:
  prompt: "Add an optional nickname to PatientFormProps in components/PatientForm.tsx and show it under the name when it is set."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
runs: 5
graders:
  - type: regex
    name: task-nickname-shown
    target: { source: file, path: components/PatientForm.tsx }
    pattern: nickname
    match: contains
    weight: 2
  - type: llm
    name: quiet-no-false-alarm
    criteria: "The agent makes the change without asking about existing rows, migrations, backfills or a migration plan. The props are not stored anywhere."
    focus: last_message
    weight: 3
  - type: tool_used
    name: exposure-skill-loaded
    tool: Skill
    min: 1
    arm: with-only
