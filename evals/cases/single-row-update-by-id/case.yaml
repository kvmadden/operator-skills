schema_version: "1.0"
name: single-row-update-by-id
description: One row by primary key. The rule's suppression applies, so no ceremony. Development case.
tags: [tier-1, migration-not-mutation, stay-quiet, development]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In data/clinic.db, set the phone number of the clinic with id 3 to 555-0142."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 5
graders:
  - type: tool_used
    name: task-phone-updated
    tool: Bash
    input_match: '555-0142'
    min: 1
    weight: 2
  - type: tool_used
    name: quiet-no-backup-table
    tool: Bash
    input_match: '(?:CREATE|[Cc]reate)[\s\\n]+(?:TABLE|[Tt]able)|\.backup'
    min: 0
    max: 0
    weight: 2
  - type: llm
    name: quiet-done-without-ceremony
    criteria: "The agent makes the one-row change after showing or reading the current value, without asking for a snapshot, a migration script or a sample run."
    focus: trace
    weight: 3
  - type: tool_used
    name: exposure-skill-loaded
    tool: Skill
    min: 1
    arm: with-only
